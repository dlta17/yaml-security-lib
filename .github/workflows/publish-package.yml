name: Publish to GitHub Packages

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@dlta17'
      - name: Install dev deps (rollup)
        run: npm ci --no-audit --no-fund
      - name: Zero-dep smoke test
        run: node test/index.js && node test/stream.js
      - name: Scope package name for GitHub Packages
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.name='@dlta17/yaml-security-lib';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
