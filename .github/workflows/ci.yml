name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node: [20, 22]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - name: Test ESM import
        run: node --input-type=module -e "import {YamlSecurity} from './src/index.js'; process.exit(0)"
      - name: Test unit
        run: node test/index.js
      - name: Test fuzz
        run: node test/fuzz.js
      - name: Test stream
        run: node test/stream.js
      - name: Install dev deps (rollup)
        run: npm ci --no-audit --no-fund
      - name: Test stream fuzz (js-yaml oracle)
        run: node test/stream-fuzz.js
      - name: Build + test CJS
        shell: bash
        run: |
          npm run build:cjs
          node -e "const {YamlSecurity}=require('./index.cjs');const p=new YamlSecurity();const r=p.parse('test: ok');process.exit(r.ok?0:1)"
      - name: Build browser bundles
        run: npm run build:browser
