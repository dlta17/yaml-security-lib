name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node: [16, 18, 20, 22]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - name: Test ESM import
        run: node --input-type=module -e "import {YamlSecurity} from './src/index.js'; process.exit(0)"
      - name: Test unit
        run: node test/index.js
      - name: Test fuzz
        run: node test/fuzz.js
      - name: Test stream
        run: node test/stream.js
      - name: Install dev deps (rollup)
        run: npm ci --no-audit --no-fund
      - name: Test stream fuzz (js-yaml oracle)
        run: node test/stream-fuzz.js
      - name: Fetch YAML Test Suite
        run: git clone --depth 1 https://github.com/yaml/yaml-test-suite.git /tmp/yaml-test-suite
      - name: Test YAML Test Suite conformance
        run: node test/yaml-test-suite.js
        env:
          YAML_SUITE_DIR: /tmp/yaml-test-suite/src
      - name: Test tree() event-stream conformance
        run: node test/tree-suite.js
        env:
          YAML_SUITE_DIR: /tmp/yaml-test-suite/src
      - name: Test schema validation
        run: node test/validate.js
      - name: Test CLI linter
        run: npm run lint
      - name: Test CLI regression suite
        run: node test/cli.js
      - name: Validate type declarations
        run: npm run build:types
      - name: Build all bundles + verify
        shell: bash
        run: |
          npm run build
          node -e "const {YamlSecurity}=require('./index.cjs');const p=new YamlSecurity();const r=p.parse('test: ok');process.exit(r.ok?0:1)"
          node -e "const {YamlSecurity}=require('./src/core.cjs');const {validate}=require('./src/validate.cjs');const {lint}=require('./src/lint.cjs');if(!(new YamlSecurity().parse('a: 1').ok)||typeof validate!=='function'||typeof lint!=='function')process.exit(1)"
          node --input-type=module -e "await import('./src/core.min.js');const {validate}=await import('./src/validate.min.js');const {lint}=await import('./src/lint.min.js');if(typeof validate!=='function'||typeof lint!=='function')process.exit(1)"
          test -s dist/core.mjs && test -s dist/core.min.js && test -s dist/yaml-security.mjs && test -s dist/yaml-security.min.js && echo "browser bundles OK"
