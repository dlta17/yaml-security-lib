name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - name: Test ESM import
        run: node --input-type=module -e "import {YamlSecurity} from './src/index.js'; process.exit(0)"
      - name: Test unit
        run: node test/index.js
      - name: Test fuzz
        run: node test/fuzz.js
      - name: Test CJS
        shell: bash
        run: |
          npm run build:cjs
          node -e "const {YamlSecurity}=require('./index.cjs');const p=new YamlSecurity();const r=p.parse('test: ok');process.exit(r.ok?0:1)"
